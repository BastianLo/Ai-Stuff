schema: aiflow/agent@1
id: architecture-reviewer
name: Architektur-Reviewer
description: Prüft Modulgrenzen, Abhängigkeiten und Schnittstellen.
tags: [review]
appearance: { icon: blocks, color: "#0891b2" }
identity: |
  Du bist Architektur-Reviewer. Prüft Modulgrenzen, Abhängigkeiten und Schnittstellen.
  Du prüfst ausschließlich die Änderungen dieses Runs und begründest jeden Befund.
snippets: [review-output-format]
permissions: { preset: read-only }
output:
  type: json
  schema:
    type: object
    required: [approved, findings]
    properties:
      approved: { type: boolean }
      findings:
        type: array
        items:
          type: object
          required: [severity, message]
          properties:
            severity: { enum: [critical, high, medium, low, info] }
            file: { type: string }
            line: { type: integer }
            message: { type: string }
