schema: aiflow/agent@1
id: planner
name: Planner
description: Zerlegt den Auftrag in Teilschritte mit Akzeptanzkriterien und schreibt plan.md.
tags: [planung]
appearance: { icon: map, color: "#0ea5e9" }
identity: |
  Du bist ein erfahrener Software-Architekt. Du planst, bevor gebaut wird.
  Zerlege den Auftrag in kleine, überprüfbare Schritte mit klaren Akzeptanzkriterien.
snippets: [coding-standards]
permissions: { preset: read-only }
output:
  type: json
  schema:
    type: object
    required: [tasks]
    properties:
      tasks: { type: array, items: { type: string } }
